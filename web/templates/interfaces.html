{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-4">Interfaces</h1>
<div class="metric rounded-2 p-3">
  <div class="table-responsive">
    <table class="table table-dark table-striped align-middle mb-0">
      <thead><tr><th>Adapter</th><th>Mode</th><th>State</th><th>MAC</th></tr></thead>
      <tbody>
        {% for item in interfaces %}
        <tr>
          <td class="fw-semibold">{{ item.name }}</td>
          <td>{{ item.mode }}</td>
          <td><span class="status-dot {{ 'status-up' if item.up else 'status-down' }}"></span>{{ item.state }}</td>
          <td class="text-secondary">{{ item.mac }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-secondary">No network adapters found</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
