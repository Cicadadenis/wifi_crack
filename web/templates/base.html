<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ project_name }} Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  </head>
  <body data-page="{{ page|default('') }}">
    <div class="container-fluid app-shell">
      <div class="row min-vh-100">
        <aside class="col-12 col-md-3 col-xl-2 sidebar p-3">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <a class="navbar-brand fw-semibold text-white" href="{{ url_for('dashboard') }}">{{ project_name }}</a>
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('logout') }}">Logout</a>
          </div>
          <nav class="nav nav-pills flex-md-column gap-1">
            <a class="nav-link {{ 'active' if page == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="nav-link {{ 'active' if page == 'interfaces' else '' }}" href="{{ url_for('interfaces_page') }}">Interfaces</a>
            <a class="nav-link {{ 'active' if page == 'plugins' else '' }}" href="{{ url_for('plugins_page') }}">Plugins</a>
            <a class="nav-link {{ 'active' if page == 'reports' else '' }}" href="{{ url_for('reports_page') }}">Reports</a>
            <a class="nav-link {{ 'active' if page == 'settings' else '' }}" href="{{ url_for('settings_page') }}">Settings</a>
            <a class="nav-link {{ 'active' if page == 'docs' else '' }}" href="{{ url_for('docs_page') }}">API Docs</a>
          </nav>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-3 p-lg-4">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
