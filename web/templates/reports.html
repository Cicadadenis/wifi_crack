{% extends "base.html" %}
{% block content %}
<div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
  <h1 class="h3 mb-0">Reports</h1>
  <form class="d-flex gap-2" method="get">
    <input class="form-control" type="search" name="q" value="{{ query }}" placeholder="Search reports">
    <button class="btn btn-primary" type="submit">Search</button>
  </form>
</div>
<div class="metric rounded-2 p-3">
  <div class="table-responsive">
    <table class="table table-dark table-striped align-middle mb-0">
      <thead><tr><th>Name</th><th>Size</th><th>Modified</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        {% for report in reports %}
        <tr>
          <td class="fw-semibold">{{ report.name }}</td>
          <td>{{ report.size }} B</td>
          <td class="text-secondary">{{ report.modified }}</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-light" href="{{ url_for('report_view', name=report.name) }}">View</a>
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('api_report_download', name=report.name) }}">Download</a>
            <button class="btn btn-sm btn-outline-danger" type="button" onclick="deleteReport('{{ report.name }}')">Delete</button>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-secondary">No reports found</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
