<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SATANA Web Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  </head>
  <body class="d-flex align-items-center py-4">
    <main class="form-signin w-100 m-auto px-3" style="max-width: 420px;">
      <form method="post" class="metric rounded-2 p-4">
        <h1 class="h4 mb-3 fw-semibold">SATANA Web</h1>
        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
          <label for="username">Username</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
          <label for="password">Password</label>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
