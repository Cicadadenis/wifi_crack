<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ project_name }} Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  </head>
  <body data-page="{{ page|default('') }}">
    <div class="container-fluid app-shell">
      <div class="row min-vh-100">
        <aside class="col-12 col-md-3 col-xl-2 sidebar p-3">
          <div class="brand-block mb-4">
            <a class="navbar-brand fw-semibold text-white d-flex align-items-center gap-2" href="{{ url_for('dashboard') }}">
              <span class="brand-mark"><i class="bi bi-wifi"></i></span>
              <span>Wi-Fi Audit</span>
            </a>
            <div class="text-secondary small mt-2">Operational dashboard</div>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-3 d-md-none">
            <span class="text-secondary small">{{ project_name }}</span>
            <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('logout') }}">Logout</a>
          </div>
          <nav class="nav nav-pills flex-md-column gap-1">
            <a class="nav-link {{ 'active' if page == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}"><i class="bi bi-grid-1x2"></i>Dashboard</a>
            <a class="nav-link {{ 'active' if page == 'main_menu' else '' }}" href="{{ url_for('main_menu_page') }}"><i class="bi bi-terminal"></i>Главное меню</a>
            <a class="nav-link {{ 'active' if page == 'interfaces' else '' }}" href="{{ url_for('interfaces_page') }}"><i class="bi bi-router"></i>Interfaces</a>
            <a class="nav-link {{ 'active' if page == 'plugins' else '' }}" href="{{ url_for('plugins_page') }}"><i class="bi bi-puzzle"></i>Plugins</a>
            <a class="nav-link {{ 'active' if page == 'reports' else '' }}" href="{{ url_for('reports_page') }}"><i class="bi bi-file-earmark-text"></i>Reports</a>
            <a class="nav-link {{ 'active' if page == 'logs' else '' }}" href="{{ url_for('logs_page') }}"><i class="bi bi-terminal"></i>Logs</a>
            <a class="nav-link {{ 'active' if page == 'settings' else '' }}" href="{{ url_for('settings_page') }}"><i class="bi bi-sliders"></i>Settings</a>
            <a class="nav-link {{ 'active' if page == 'docs' else '' }}" href="{{ url_for('docs_page') }}"><i class="bi bi-braces"></i>API Docs</a>
          </nav>
          <a class="btn btn-sm btn-outline-secondary mt-4 w-100 d-none d-md-inline-flex justify-content-center" href="{{ url_for('logout') }}">Logout</a>
        </aside>
        <main class="col-12 col-md-9 col-xl-10 p-3 p-lg-4">
          <div class="topbar d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
              <div class="text-secondary small">SATANA Web UI</div>
              <div class="h5 mb-0">Wi-Fi Audit Dashboard</div>
            </div>
            <span class="badge status-badge status-success"><i class="bi bi-shield-check"></i>Authenticated</span>
          </div>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
